name: Simplificar cartão para Clinicorp

on:
  push:
    paths:
      - .github/workflows/simplify-clinicorp-card-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Ajustar fluxo operacional
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('lib/nf-workbook.ts')
          text = parser.read_text(encoding='utf-8')
          replacements = [
            ('return paymentMethod === "Boleto" ? "Clinicorp" as const : "Saúde Service" as const;',
             'return "Clinicorp" as const;'),
            ('sourceSystem: "Clinicorp" | "Saúde Service",',
             'sourceSystem: "Clinicorp",'),
            ('sourceSystem: "Clinicorp" | "Saúde Service",',
             'sourceSystem: "Clinicorp",'),
            ('`Origem: ${sourceSystem} / ${paymentMethod}`',
             '`Conciliação: ${sourceSystem} / ${paymentMethod}`'),
            ('// esquerda = Boleto puxado do Clinicorp; direita = Cartão puxado da Saúde Service.',
             '// esquerda = Boleto; direita = Cartão. As baixas dos dois são conciliadas pelo Clinicorp.'),
            ('parseLegacyBlock(sheetName, rows, legacyHeaderIndex, 7, "Cartão", "Saúde Service", fileUnit)',
             'parseLegacyBlock(sheetName, rows, legacyHeaderIndex, 7, "Cartão", "Clinicorp", fileUnit)'),
          ]
          for old, new in replacements:
            if old in text:
              text = text.replace(old, new)
          parser.write_text(text, encoding='utf-8')

          app = Path('components/nf-workbook-import.tsx')
          text = app.read_text(encoding='utf-8')
          replacements = [
            ('No modelo mensal, esquerda é Boleto/Clinicorp e direita é Cartão/Saúde Service.',
             'No modelo mensal, esquerda é Boleto e direita é Cartão. As baixas dos dois são conciliadas pelo Clinicorp.'),
            ('<CheckLine>Modelo mensal: esquerda = Boleto/Clinicorp</CheckLine>',
             '<CheckLine>Modelo mensal: esquerda = Boleto</CheckLine>'),
            ('<CheckLine>Modelo mensal: direita = Cartão/Saúde Service</CheckLine>',
             '<CheckLine>Modelo mensal: direita = Cartão</CheckLine>'),
            ('<CheckLine>Separa Sorocaba e Salto antes de salvar</CheckLine>',
             '<CheckLine>Clinicorp confirma baixas de boleto e cartão</CheckLine>\n          <CheckLine>Separa Sorocaba e Salto antes de salvar</CheckLine>'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Trecho não encontrado: {old}')
            text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')
          PY
      - name: Validar produção
        run: |
          npm ci
          node --test tests/clinicorp-sync.test.mjs
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add lib/nf-workbook.ts components/nf-workbook-import.tsx
          git commit -m "refactor: usa Clinicorp para baixas de boleto e cartão"
          git push
