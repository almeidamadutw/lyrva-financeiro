name: Conectar Jornada Financeira

on:
  push:
    paths:
      - .github/workflows/lyvra-wire-financial-journey.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conectar a jornada no LYVRA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("components/lyrva-app.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { CollectionsJourney } from "@/components/collections-journey";\n',
                  'import { CollectionsJourney } from "@/components/collections-journey";\nimport { FinancialJourney } from "@/components/financial-journey";\n',
              ),
              (
                  'type View = "dashboard" | "invoices" | "collections" | "patients" | "import" | "access" | "support" | "integrations";',
                  'type View = "dashboard" | "journey" | "invoices" | "collections" | "patients" | "import" | "access" | "support" | "integrations";',
              ),
              (
                  '  { id: "dashboard", label: "Visão geral", icon: LayoutDashboard },\n',
                  '  { id: "dashboard", label: "Visão geral", icon: LayoutDashboard },\n  { id: "journey", label: "Jornada financeira", icon: Sparkles },\n',
              ),
              (
                  '  dashboard: { eyebrow: "Operação financeira", title: "Visão geral" },\n',
                  '  dashboard: { eyebrow: "Operação financeira", title: "Visão geral" },\n  journey: { eyebrow: "Operação financeira", title: "Jornada financeira" },\n',
              ),
              (
                  '<SidebarProvider>',
                  '<SidebarProvider className="app-density">',
              ),
              (
                  '''          <SidebarGroup className="mt-3">\n            <SidebarGroupLabel className="text-[10px] uppercase tracking-[0.16em] text-white/35">Aguardando estrutura</SidebarGroupLabel>\n            <SidebarGroupContent><SidebarMenu>\n              <SidebarMenuItem><SidebarMenuButton tooltip="Jornada financeira" className="h-10 rounded-xl px-3 text-white/38"><Sparkles /><span>Jornada financeira</span></SidebarMenuButton></SidebarMenuItem>\n            </SidebarMenu></SidebarGroupContent>\n          </SidebarGroup>\n''',
                  '',
              ),
              (
                  '            {view === "dashboard" && <DashboardView unit={unit} obligations={obligations} reminderCount={reminderCount} goTo={setView} />}\n',
                  '            {view === "dashboard" && <DashboardView unit={unit} obligations={obligations} reminderCount={reminderCount} goTo={setView} />}\n            {view === "journey" && <FinancialJourney unit={unit} />}\n',
              ),
              (
                  '.from("message_events")\n          .select("id", { count: "exact", head: true })\n          .eq("kind", "boleto_reminder")\n          .gte("scheduled_for", tomorrow.toISOString())\n          .lt("scheduled_for", afterTomorrow.toISOString())\n          .in("status", ["scheduled", "processing"]),',
                  '.from("financial_tasks")\n          .select("id", { count: "exact", head: true })\n          .eq("kind", "payment_reminder")\n          .gte("due_at", tomorrow.toISOString())\n          .lt("due_at", afterTomorrow.toISOString())\n          .in("status", ["pending", "in_progress"]),',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Trecho esperado não encontrado: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar TypeScript
        run: |
          npm ci
          npm run build

      - name: Salvar alteração
        shell: bash
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyrva-app.tsx
          git commit -m "feat: ativa jornada financeira no menu"
          git push
