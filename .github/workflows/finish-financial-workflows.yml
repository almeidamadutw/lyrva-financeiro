name: Finalizar rotinas financeiras

on:
  push:
    paths:
      - .github/workflows/finish-financial-workflows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajustes
        run: python3 .github/scripts/finish_financial_workflows.py
      - name: Validar produção
        run: |
          npm ci
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx components/nf-workbook-import.tsx components/collections-journey-real.tsx lib/nf-workbook.ts
          git commit -m "feat: quitação protegida, régua importável e revisão de lembretes"
          git push
