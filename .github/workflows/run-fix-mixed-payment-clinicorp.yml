name: Corrigir pagamento misto Clinicorp

on:
  push:
    paths:
      - .github/workflows/run-fix-mixed-payment-clinicorp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Aplicar patch
        run: python3 .github/scripts/fix_mixed_payment_clinicorp.py
      - name: Validar
        run: |
          npm ci
          node --test tests/clinicorp-sync.test.mjs
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add lib/nf-workbook.ts
          git commit -m "fix: preserva pagamento misto com conciliação Clinicorp"
          git push
