name: Diagnosticar build Vercel

on:
  push:
    paths:
      - .github/workflows/diagnose-vercel-next-build.yml

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
