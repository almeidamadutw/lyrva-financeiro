name: Aplicar auditoria de dados LYVRA

on:
  push:
    paths:
      - .github/workflows/apply-clinicorp-settlement-ui.yml
      - .github/scripts/patch_clinicorp_settlement_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar correções auditadas
        run: |
          python3 .github/scripts/patch_clinicorp_settlement_ui.py
          sed -i 's/let query = supabase$/let query = (supabase as any)/' components/collections-journey-real.tsx
      - name: Validar build
        run: |
          npm ci
          npx next build
      - name: Publicar ajustes
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx components/nf-workbook-import.tsx lib/nf-workbook.ts components/financial-journey.tsx components/collections-journey-real.tsx components/financial-notifications.tsx components/due-task-alert.tsx components/workbook-import-hub.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "fix: audit LYVRA financial data flows"
          git push