name: Aplicar fluxo canônico LYVRA

on:
  push:
    paths:
      - .github/workflows/apply-clinicorp-settlement-ui.yml
      - .github/scripts/finalize_canonical_data_flows.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar preservação das fontes
        run: python3 .github/scripts/finalize_canonical_data_flows.py
      - name: Validar build
        run: |
          npm ci
          npx next build
      - name: Publicar ajustes
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/nf-workbook-import.tsx components/collections-workbook-import.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "fix: preserve every workbook source row"
          git push