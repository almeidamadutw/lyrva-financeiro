name: Aplicar fluxo de baixa Clinicorp

on:
  push:
    paths:
      - .github/workflows/apply-clinicorp-settlement-ui.yml
      - .github/scripts/patch_clinicorp_settlement_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar interface de baixa
        run: python3 .github/scripts/patch_clinicorp_settlement_ui.py
      - name: Validar build
        run: |
          npm ci
          npx next build
      - name: Publicar ajuste
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "feat: add Clinicorp settlement request flow"
          git push
