name: Revisar acessos e textos operacionais

on:
  push:
    paths:
      - .github/workflows/refine-role-ui-and-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar patch
        run: python3 .github/scripts/refine_role_ui_and_copy.py
      - name: Validar produção
        run: |
          npm ci
          npx next build
      - name: Publicar alterações
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx components/financial-journey.tsx components/collections-journey-real.tsx components/nf-workbook-import.tsx supabase/functions/access-admin/index.ts
          git commit -m "feat: ajusta telas por função e remove copy genérica"
          git push
