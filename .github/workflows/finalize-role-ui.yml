name: Finalizar telas por função

on:
  push:
    paths:
      - .github/workflows/finalize-role-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar ajustes finais
        run: python3 .github/scripts/finalize_role_ui.py
      - name: Validar produção
        run: |
          npm ci
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx components/financial-journey.tsx supabase/functions/access-admin/index.ts
          git commit -m "feat: finaliza menus e rotinas por função"
          git push
