name: Restaurar telas financeiras

on:
  push:
    paths:
      - .github/workflows/restore-financial-views.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar ajuste
        run: python3 .github/scripts/restore_financial_views.py
      - name: Validar produção
        run: |
          npm ci
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx
          git commit -m "fix: libera todas as telas financeiras para a equipe"
          git push
