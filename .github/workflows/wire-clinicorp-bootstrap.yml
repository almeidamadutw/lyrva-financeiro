name: Conectar conciliação histórica Clinicorp

on:
  push:
    paths:
      - .github/workflows/wire-clinicorp-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ligar bootstrap ao botão de baixas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/lyvra-app.tsx')
          text = path.read_text(encoding='utf-8')

          old_type = '''  sync?: {\n    processedCount: number;\n    createdCount: number;\n    updatedCount: number;\n    skippedCount: number;\n    failedCount: number;\n    paidInstallments: number;\n  };\n};'''
          new_type = '''  sync?: {\n    processedCount: number;\n    createdCount: number;\n    updatedCount: number;\n    skippedCount: number;\n    failedCount: number;\n    paidInstallments: number;\n  };\n  bootstrap?: boolean;\n  alreadyComplete?: boolean;\n  windows?: number;\n  from?: string;\n  to?: string;\n};'''
          if old_type not in text:
              raise SystemExit('Tipo ClinicorpFunctionResponse não encontrado')
          text = text.replace(old_type, new_type, 1)

          invoke_anchor = '''async function invokeClinicorp(body: Record<string, unknown>) {\n  const supabase = getSupabaseBrowserClient();\n  const { data, error } = await supabase.functions.invoke<ClinicorpFunctionResponse>("clinicorp-sync", { body });\n  if (error) throw new Error(await clinicorpErrorMessage(error));\n  if (!data?.ok) throw new Error(data?.message ?? "A integração não concluiu a solicitação.");\n  return data;\n}\n'''
          bootstrap_helper = invoke_anchor + '''\nasync function invokeClinicorpBootstrap(unitCode: ClinicorpUnitCode) {\n  const supabase = getSupabaseBrowserClient();\n  const { data, error } = await supabase.functions.invoke<ClinicorpFunctionResponse>("clinicorp-bootstrap", {\n    body: { unitCode },\n  });\n  if (error) throw new Error(await clinicorpErrorMessage(error));\n  if (!data?.ok) throw new Error(data?.message ?? "A conciliação histórica não foi concluída.");\n  return data;\n}\n'''
          if invoke_anchor not in text:
              raise SystemExit('Helper invokeClinicorp não encontrado')
          text = text.replace(invoke_anchor, bootstrap_helper, 1)

          pattern = re.compile(r'  const syncPayments = async \(unitCode: ClinicorpUnitCode\) => \{.*?\n  \};\n\n  const secondaryCards =', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('Função syncPayments não encontrada')

          replacement = '''  const syncPayments = async (unitCode: ClinicorpUnitCode) => {\n    const to = new Date();\n    const from = new Date(to);\n    from.setDate(from.getDate() - 6);\n    setBusyUnit(unitCode);\n    try {\n      const bootstrap = await invokeClinicorpBootstrap(unitCode);\n      if (bootstrap.bootstrap && !bootstrap.alreadyComplete) {\n        const sync = bootstrap.sync;\n        if (!sync) throw new Error("O resumo da conciliação histórica não foi retornado.");\n        toast.success("Histórico do Clinicorp conciliado", {\n          description: `${sync.paidInstallments} parcela(s) ficaram pagas • ${sync.createdCount + sync.updatedCount} pagamento(s) vinculados • ${sync.skippedCount} item(ns) ficaram para revisão.`,\n        });\n        await loadStatuses();\n        return;\n      }\n\n      const result = await invokeClinicorp({\n        action: "sync_existing_payments",\n        unitCode,\n        from: saoPauloDate(from),\n        to: saoPauloDate(to),\n      });\n      const sync = result.sync;\n      if (!sync) throw new Error("O resumo da sincronização não foi retornado.");\n\n      const changed = sync.createdCount + sync.updatedCount;\n      if (changed > 0) {\n        toast.success("Baixas sincronizadas", {\n          description: `${sync.paidInstallments} parcela(s) ficaram pagas • ${changed} pagamento(s) vinculados.`,\n        });\n      } else {\n        toast.info("Nenhuma baixa vinculada", {\n          description: sync.skippedCount\n            ? `${sync.skippedCount} movimento(s) foram ignorados porque ainda não há correspondência segura no LYVRA.`\n            : "Não há novas baixas confirmadas para os pacientes cadastrados.",\n        });\n      }\n      if (sync.failedCount) {\n        toast.warning(`${sync.failedCount} movimento(s) precisam de revisão técnica.`);\n      }\n      await loadStatuses();\n    } catch (error) {\n      toast.error("As baixas não foram sincronizadas", { description: await clinicorpErrorMessage(error) });\n    } finally {\n      setBusyUnit(null);\n    }\n  };\n\n  const secondaryCards ='''
          text = pattern.sub(replacement, text, count=1)

          old_note = 'A sincronização só atualiza pacientes e parcelas já cadastrados no LYVRA. Nenhum paciente novo é criado pelo Clinicorp, e a baixa só é aplicada quando o pagamento está confirmado.'
          new_note = 'A primeira sincronização concilia o histórico desde o início dos planos. Depois, o LYVRA atualiza somente o período recente. Nenhum paciente novo é criado pelo Clinicorp, e a baixa só é aplicada quando o pagamento está confirmado.'
          if old_note in text:
              text = text.replace(old_note, new_note, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar exatamente como a Vercel
        run: |
          npm ci
          npx next build

      - name: Salvar alteração
        shell: bash
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx
          git commit -m "feat: bootstrap historical Clinicorp settlements" || exit 0
          git push
