name: Corrigir pagamento misto Clinicorp

on:
  push:
    paths:
      - .github/workflows/fix-mixed-payment-after-clinicorp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Corrigir mesclagem
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/nf-workbook.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    const existing = result[existingIndex];
    const mixedSource = existing.sourceSystem !== row.sourceSystem;
    result[existingIndex] = {
      ...existing,
      paymentMethod: mixedSource ? "Misto" : row.paymentMethod,
      sourceSystem: mixedSource ? "Misto" : row.sourceSystem,'''
          new = '''    const existing = result[existingIndex];
    const mixedPayment = existing.paymentMethod !== row.paymentMethod;
    const mixedSource = existing.sourceSystem !== row.sourceSystem;
    result[existingIndex] = {
      ...existing,
      paymentMethod: mixedPayment ? "Misto" : row.paymentMethod,
      sourceSystem: mixedSource ? "Misto" : row.sourceSystem,'''
          if old not in text:
            raise SystemExit('Trecho de mesclagem não encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validar
        run: |
          npm ci
          node --test tests/clinicorp-sync.test.mjs
          npx next build
      - name: Publicar
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add lib/nf-workbook.ts
          git commit -m "fix: preserva pagamento misto com conciliação Clinicorp"
          git push
