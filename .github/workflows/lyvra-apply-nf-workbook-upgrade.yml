name: Aplicar Upgrade Fiscal LYVRA

on:
  push:
    paths:
      - .github/workflows/lyvra-apply-nf-workbook-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar interface principal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('components/lyrva-app.tsx')
          text = path.read_text(encoding='utf-8')

          reps = [
            (
              'import { FinancialJourney } from "@/components/financial-journey";\nimport { getSupabaseBrowserClient } from "@/lib/supabase/client";',
              'import { FinancialJourney } from "@/components/financial-journey";\nimport { ManualPatientDialog } from "@/components/manual-patient-dialog";\nimport { NfWorkbookImportView } from "@/components/nf-workbook-import";\nimport { getSupabaseBrowserClient } from "@/lib/supabase/client";'
            ),
            (
              '  planAmountCents?: number;\n  startDate?: string | null;\n  installments?: number | null;\n  dueDay?: number | null;\n  taxReceiptIr?: boolean | number;\n  invoiceFrequency?: string;\n  notes?: string | null;',
              '  planAmountCents?: number;\n  installmentAmountCents?: number;\n  startDate?: string | null;\n  endDate?: string | null;\n  installments?: number | null;\n  dueDay?: number | null;\n  taxReceiptIr?: boolean | number;\n  invoiceFrequency?: string;\n  invoiceScheduleMode?: string | null;\n  firstInvoiceDate?: string | null;\n  invoiceIntervalMonths?: number | null;\n  invoiceRecipientName?: string | null;\n  invoiceDisabled?: boolean;\n  invoiceDisabledReason?: string | null;\n  notes?: string | null;'
            ),
            (
              '  rawStatus: string;\n  frequency: string;\n};',
              '  rawStatus: string;\n  frequency: string;\n  scheduledIssueDate?: string | null;\n  ruleCode?: string | null;\n  issuedAmount?: number;\n};'
            ),
            (
              'const moneyValue = (value = 0) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value);\nconst digits =',
              'const moneyValue = (value = 0) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value);\nconst formatIsoDate = (value?: string | null) => value ? new Intl.DateTimeFormat("pt-BR", { timeZone: "UTC" }).format(new Date(`${value}T12:00:00Z`)) : "—";\nconst digits ='
            ),
            (
              '        planAmountCents: Math.round(Number(row.plan_amount ?? 0) * 100),\n        startDate: row.start_date,\n        installments: row.installment_count,\n        dueDay: row.due_day,\n        taxReceiptIr: row.tax_receipt_ir ?? undefined,\n        invoiceFrequency: row.invoice_frequency === "four_monthly" ? "Quadrimestral" : "Mensal",\n        notes: row.notes,',
              '        planAmountCents: Math.round(Number(row.plan_amount ?? 0) * 100),\n        installmentAmountCents: Math.round(Number(row.installment_amount ?? 0) * 100),\n        startDate: row.start_date,\n        endDate: row.end_date,\n        installments: row.installment_count,\n        dueDay: row.due_day,\n        taxReceiptIr: row.tax_receipt_ir ?? undefined,\n        invoiceFrequency: row.invoice_frequency === "yearly" ? "Anual" : row.invoice_frequency === "four_monthly" ? "Quadrimestral" : row.invoice_frequency === "monthly" ? "Mensal" : row.invoice_frequency === "custom" ? "Personalizada" : "Regra automática",\n        invoiceScheduleMode: row.invoice_schedule_mode,\n        firstInvoiceDate: row.first_invoice_date,\n        invoiceIntervalMonths: row.invoice_interval_months,\n        invoiceRecipientName: row.invoice_recipient_name,\n        invoiceDisabled: Boolean(row.invoice_disabled),\n        invoiceDisabledReason: row.invoice_disabled_reason,\n        notes: row.notes,'
            ),
            (
              '        const amountValue = Number(row.paid_amount || row.expected_amount || 0);',
              '        const amountValue = Number(row.status === "issued" ? (row.issued_amount || row.expected_amount || 0) : (row.expected_amount || row.paid_amount || 0));'
            ),
            (
              '          rawStatus: row.status,\n          frequency: row.frequency,',
              '          rawStatus: row.status,\n          frequency: row.frequency,\n          scheduledIssueDate: row.scheduled_issue_date,\n          ruleCode: row.rule_code,\n          issuedAmount: Number(row.issued_amount ?? 0),'
            ),
            (
              '    const { error } = await supabase\n      .from("invoice_obligations")\n      .update({ status: "issued", invoice_issued_at: timestamp, completed_at: timestamp })',
              '    const obligation = obligations.find((item) => item.id === id);\n    const { error } = await supabase\n      .from("invoice_obligations")\n      .update({ status: "issued", invoice_issued_at: timestamp, completed_at: timestamp, issued_amount: obligation?.amountValue ?? 0 })'
            ),
            (
              '{view === "patients" && <PatientsView unit={unit} patients={patients} loading={loadingPatients} goTo={setView} />}\n            {view === "import" && <ImportView onImported={async () => { await loadFinancialData(); setView("patients"); }} />}',
              '{view === "patients" && <PatientsView unit={unit} patients={patients} loading={loadingPatients} goTo={setView} onSaved={loadFinancialData} />}\n            {view === "import" && <NfWorkbookImportView onImported={async () => { await loadFinancialData(); setView("patients"); }} />}'
            ),
            (
              '<MetricCard label="Aguardando baixa" value={String(waiting.length)} detail={total(waiting)} icon={CircleDollarSign} accent="amber" />',
              '<MetricCard label="Em acompanhamento" value={String(waiting.length)} detail={total(waiting)} icon={CircleDollarSign} accent="amber" />'
            ),
            (
              '<SelectItem value="cycle">Quadrimestre</SelectItem>',
              '<SelectItem value="cycle">Ciclo anterior</SelectItem>'
            ),
            (
              '<div className="grid gap-4 md:grid-cols-2"><RuleCard title="Sorocaba" label="Emissão mensal" description="A nota é liberada após a baixa e considera o total pago no mês." /><RuleCard title="Salto de Pirapora" label="Emissão quadrimestral" description="O LYVRA acumula quatro meses pagos e cria uma única obrigação no fechamento." /></div>',
              '<div className="grid gap-4 md:grid-cols-2"><RuleCard title="Cartão" label="1 NF por ano" description="A NF é prevista no primeiro recebimento do ano e considera as parcelas daquele ano-calendário." /><RuleCard title="Boleto" label="Fim do parcelamento ou 31/12" description="A NF é prevista no término do parcelamento ou em 31 de dezembro, o que acontecer primeiro. O restante segue para o ano seguinte." /></div>'
            ),
            (
              'function PatientsView({ unit, patients, loading, goTo }: { unit: string; patients: Patient[]; loading: boolean; goTo: (view: View) => void }) {',
              'function PatientsView({ unit, patients, loading, goTo, onSaved }: { unit: string; patients: Patient[]; loading: boolean; goTo: (view: View) => void; onSaved: () => Promise<void> }) {'
            ),
            (
              '<div className="flex gap-2"><div className="relative"><Search className="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-[#8b9690]" /><Input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar paciente" className="h-10 w-52 rounded-xl pl-9 shadow-none" /></div><Button onClick={() => goTo("import")} className="h-10 rounded-xl"><UploadCloud /> Importar</Button></div>',
              '<div className="flex flex-wrap gap-2"><div className="relative"><Search className="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-[#8b9690]" /><Input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar paciente" className="h-10 w-52 rounded-xl pl-9 shadow-none" /></div><ManualPatientDialog onSaved={onSaved} /><Button onClick={() => goTo("import")} variant="outline" className="h-10 rounded-xl"><UploadCloud /> Importar</Button></div>'
            ),
            (
              '<TableCell>{patient.invoiceFrequency || (patient.unit === "Sorocaba" ? "Mensal" : "Quadrimestral")}</TableCell>',
              '<TableCell>{patient.invoiceDisabled ? <span className="text-[#a05a48]">Não emitir</span> : patient.invoiceFrequency || "Regra automática"}</TableCell>'
            ),
            (
              '<TableCell>{item.reference}</TableCell>',
              '<TableCell><p>{item.reference}</p>{item.scheduledIssueDate && <p className="mt-1 text-xs text-[#839087]">Prevista {formatIsoDate(item.scheduledIssueDate)}</p>}</TableCell>'
            ),
            (
              '''function QuarterCard({ obligations }: { obligations: InvoiceObligation[] }) {\n  const quarter = obligations.filter((item) => item.unit === "Salto de Pirapora" && item.frequency === "four_monthly" && item.rawStatus !== "cancelled");\n  const amount = quarter.reduce((sum, item) => sum + item.amountValue, 0);\n  return <div className="surface-card rounded-[24px] p-5 md:p-6"><div className="flex items-start justify-between"><div><p className="eyebrow">SALTO DE PIRAPORA</p><h3 className="font-display mt-2 text-xl font-semibold">Acompanhamento quadrimestral</h3></div><div className="grid size-10 place-items-center rounded-2xl bg-[#e4f8ee] text-[#00884a]"><CalendarDays className="size-5" /></div></div><div className="mt-6"><p className="text-sm text-[#78857e]">Valor registrado nas obrigações abertas</p><p className="font-display mt-1 text-3xl font-semibold tracking-tight">{moneyValue(amount)}</p></div><div className="mt-5 flex justify-between border-t border-[#e9eee7] pt-4 text-xs text-[#849087]"><span>{quarter.length} obrigação(ões)</span><span>Ciclo pendente de definição</span></div></div>;\n}''',
              '''function QuarterCard({ obligations }: { obligations: InvoiceObligation[] }) {\n  const open = obligations.filter((item) => !["issued", "cancelled"].includes(item.rawStatus));\n  const amount = open.reduce((sum, item) => sum + item.amountValue, 0);\n  const next = [...open].filter((item) => item.scheduledIssueDate).sort((a, b) => String(a.scheduledIssueDate).localeCompare(String(b.scheduledIssueDate)))[0];\n  return <div className="surface-card rounded-[24px] p-5 md:p-6"><div className="flex items-start justify-between"><div><p className="eyebrow">AGENDA FISCAL</p><h3 className="font-display mt-2 text-xl font-semibold">Próximas emissões</h3></div><div className="grid size-10 place-items-center rounded-2xl bg-[#e4f8ee] text-[#00884a]"><CalendarDays className="size-5" /></div></div><div className="mt-6"><p className="text-sm text-[#78857e]">Valor previsto nas obrigações abertas</p><p className="font-display mt-1 text-3xl font-semibold tracking-tight">{moneyValue(amount)}</p></div><div className="mt-5 flex justify-between gap-3 border-t border-[#e9eee7] pt-4 text-xs text-[#849087]"><span>{open.length} obrigação(ões)</span><span>{next?.scheduledIssueDate ? `Próxima: ${formatIsoDate(next.scheduledIssueDate)}` : "Sem emissão prevista"}</span></div></div>;\n}'''
            ),
          ]

          for old, new in reps:
            if old not in text:
              raise SystemExit(f'Trecho esperado não encontrado: {old[:140]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyrva-app.tsx
          git commit -m "feat: atualiza pacientes importação e regras fiscais"
          git push
