name: Responsividade adaptativa

on:
  push:
    paths:
      - '.github/scripts/patch_responsive_density.py'
      - '.github/workflows/patch-responsive-density.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar ajuste
        run: python .github/scripts/patch_responsive_density.py
      - name: Validar produção
        run: |
          npm ci --ignore-scripts
          npx next build
      - name: Publicar
        run: |
          git config user.name 'lyvra-automation'
          git config user.email '164823888+almeidamadutw@users.noreply.github.com'
          git add app/globals.css components/lyvra-app.tsx components/collections-journey-real.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: adapta layout e densidade à largura disponível'
          git push
