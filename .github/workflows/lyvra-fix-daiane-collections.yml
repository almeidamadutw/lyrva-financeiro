name: Corrigir acesso Daiane cobrança

on:
  push:
    paths:
      - .github/workflows/lyvra-fix-daiane-collections.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar shell do LYVRA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/lyvra-app.tsx')
          s = path.read_text(encoding='utf-8')

          old = '''type UserAccount = {\n  id: string;\n  name: string;\n  email: string;\n  role: Role;\n};'''
          new = '''type UserAccount = {\n  id: string;\n  name: string;\n  email: string;\n  role: Role;\n  canManageCollections: boolean;\n};'''
          if old not in s:
            raise SystemExit('UserAccount não encontrado')
          s = s.replace(old, new, 1)

          old = '''    if (error || !data?.is_active) return null;\n    return {\n      id: data.user_id,\n      name: data.full_name,\n      email: data.email,\n      role: data.role as Role,\n    };'''
          new = '''    if (error || !data?.is_active) return null;\n\n    const { data: collectionUnits, error: collectionUnitsError } = await supabase\n      .from("units")\n      .select("id")\n      .eq("collection_assignee_user_id", userId)\n      .eq("is_active", true)\n      .limit(1);\n\n    if (collectionUnitsError) return null;\n\n    return {\n      id: data.user_id,\n      name: data.full_name,\n      email: data.email,\n      role: data.role as Role,\n      canManageCollections: Boolean(collectionUnits?.length),\n    };'''
          if old not in s:
            raise SystemExit('loadProfile não encontrado')
          s = s.replace(old, new, 1)

          old = '''  const visibleNavItems = navItems.filter((item) => {\n    if (item.id === "integrations") return currentUser.role === "suporte";'''
          new = '''  const visibleNavItems = navItems.filter((item) => {\n    if (item.id === "collections") return currentUser.canManageCollections || ["gestora", "ceo", "suporte"].includes(currentUser.role);\n    if (item.id === "integrations") return currentUser.role === "suporte";'''
          if old not in s:
            raise SystemExit('visibleNavItems não encontrado')
          s = s.replace(old, new, 1)

          old = '''      <DueTaskAlert userId={currentUser.id} onOpenJourney={() => setView("journey")} />'''
          new = '''      <DueTaskAlert userId={currentUser.id} onOpenJourney={() => setView("journey")} onOpenCollections={() => setView("collections")} />'''
          if old not in s:
            raise SystemExit('DueTaskAlert não encontrado')
          s = s.replace(old, new, 1)

          old = '''            <FinancialNotifications userId={currentUser.id} unit={unit} onOpenJourney={() => setView("journey")} />'''
          new = '''            <FinancialNotifications userId={currentUser.id} unit={unit} onOpenJourney={() => setView("journey")} onOpenCollections={() => setView("collections")} />'''
          if old not in s:
            raise SystemExit('FinancialNotifications não encontrado')
          s = s.replace(old, new, 1)

          old = '''<p className="truncate text-xs text-white/42">{roleLabels[currentUser.role]}</p>'''
          new = '''<p className="truncate text-xs text-white/42">{currentUser.role === "membro" && currentUser.canManageCollections ? "Cobrança" : roleLabels[currentUser.role]}</p>'''
          if old not in s:
            raise SystemExit('rótulo do perfil não encontrado')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validar release
        run: |
          npm ci
          npm test

      - name: Salvar alteração
        shell: bash
        run: |
          git config user.name "lyvra-automation"
          git config user.email "164823888+almeidamadutw@users.noreply.github.com"
          git add components/lyvra-app.tsx
          git commit -m "fix: scope collection access to Daiane and leadership"
          git push
